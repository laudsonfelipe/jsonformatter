<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>  <rect width='100' height='100' rx='20' fill='%232b6cb0'/>  <text x='50%' y='65%' text-anchor='middle' font-size='55' font-family='monospace' fill='white'>{}</text></svg>">
    <title>Formatador JSON</title>
    <style>
      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
        background: linear-gradient(135deg, #1a202c 0%, #2d3748 100%);
        color: #e2e8f0;
        margin: 0;
        padding: 20px 0;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        box-sizing: border-box;
        overflow-x: hidden;
      }
      header {
        text-align: center;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 1.8em;
        font-weight: 700;
        color: #63b3ed;
        letter-spacing: -0.025em;
      }
      .container {
        display: flex;
        flex: 1;
        gap: 20px;
        width: 100%;
        margin: 0;
        box-sizing: border-box;
        max-height: calc(100vh - 120px);
        overflow: hidden;
        padding: 0 20px;
      }
      .editor {
        min-width: 300px;
        max-width: 500px;
        width: 500px;
        display: flex;
        flex-direction: column;
        background: #2d3748;
        border-radius: 10px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        padding: 15px;
        box-sizing: border-box;
        border: 1px solid #4a5568;
        flex-shrink: 0;
      }
      .viewer {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: #2d3748;
        border-radius: 10px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        padding: 15px;
        min-width: 0;
        max-width: 100%;
        box-sizing: border-box;
        border: 1px solid #4a5568;
        overflow: hidden;
      }
      textarea {
        flex: 1;
        padding: 12px;
        font-family: "Fira Code", monospace;
        font-size: 14px;
        border: 1px solid #4a5568;
        border-radius: 6px;
        resize: none;
        background: #1a202c;
        color: #e2e8f0;
        transition: border-color 0.2s;
        width: 100%;
        box-sizing: border-box;
        overflow-y: auto;
        max-height: calc(100vh - 200px);
      }
      textarea:focus {
        outline: none;
        border-color: #63b3ed;
      }
      #output {
        flex: 1;
        padding-bottom: 12px;
        font-family: "Fira Code", monospace;
        font-size: 14px;
        border: 1px solid #4a5568;
        border-radius: 6px;
        background: #1a202c;
        color: #e2e8f0;
        overflow-y: auto;
        overflow-x: auto;
        white-space: pre;
        position: relative;
        word-break: normal;
        overflow-wrap: normal;
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
        max-height: calc(100vh - 200px);
        min-width: 0;
        display: flex;
      }
      
      .line-numbers {
        background: #2d3748;
        color: #718096;
        padding: 12px 8px 12px 12px;
        border-right: 1px solid #4a5568;
        font-family: "Fira Code", monospace;
        font-size: 14px;
        line-height: 1.5;
        user-select: none;
        text-align: right;
        min-width: 40px;
        flex-shrink: 0;
      }
      
      .code-content-wrapper {
        flex: 1;
        padding: 12px 12px 12px 8px;
        overflow-x: visible;
        min-width: 0;
        word-wrap: break-word;
        overflow-wrap: break-word;
      }
      .tree-view {
        flex: 1;
        padding: 12px;
        border: 1px solid #4a5568;
        border-radius: 6px;
        background: #1a202c;
        color: #e2e8f0;
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
        max-height: calc(100vh - 200px);
        min-width: 0;
        font-family: "Fira Code", monospace;
        font-size: 14px;
        line-height: 1.5;
        overflow-y: auto;
        overflow-x: auto;
        white-space: pre;
        user-select: text;
        cursor: text;
      }
      
      .tree-line {
        display: block;
        padding: 2px 4px;
        margin: 1px 0;
        border-radius: 3px;
        cursor: pointer;
        transition: background-color 0.2s;
      }
      
      .tree-line:hover {
        background-color: #2d3748;
      }
      
      .tree-line.selected {
        background-color: #4299e1;
        color: #fff;
      }
      .controls {
        display: flex;
        justify-content: flex-start;
        gap: 6px;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }
      button {
        padding: 6px 10px;
        background: #4299e1;
        color: #fff;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 500;
        font-size: 12px;
        transition: background 0.2s, transform 0.1s;
        white-space: nowrap;
        flex-shrink: 0;
      }
      button:hover {
        background: #3182ce;
        transform: translateY(-1px);
      }
      button:active {
        transform: translateY(0);
      }
      button.active {
        background: #2b6cb0;
        color: #fff;
        font-weight: 600;
      }
      select {
        padding: 6px 8px;
        border-radius: 6px;
        border: 1px solid #4a5568;
        background: #3182ce;
        color: #e2e8f0;
        cursor: pointer;
        font-size: 12px;
        white-space: nowrap;
        flex-shrink: 0;
      }
      #error {
        color: #e53e3e;
        font-size: 14px;
        margin-top: 10px;
        font-weight: 500;
      }
      ul {
        list-style: none;
        padding-left: 20px;
        margin: 0;
      }
      li {
        margin: 4px 0;
      }
      .collapsible {
        cursor: pointer;
        user-select: none;
        display: inline-flex;
        align-items: center;
      }
      .collapsible::before {
        content: "▶";
        display: inline-block;
        margin-right: 6px;
        font-size: 10px;
        transition: transform 0.2s;
      }
      .collapsible.open::before {
        transform: rotate(90deg);
      }
      .content {
        display: none;
      }
      .open > .content {
        display: block;
      }
      .image-preview {
        position: relative;
        display: inline-block;
      }
      .image-preview:hover .preview {
        display: block;
      }
      .preview {
        display: none;
        position: absolute;
        z-index: 10;
        background: #2d3748;
        border: 1px solid #4a5568;
        padding: 5px;
        border-radius: 4px;

      .preview img {

      .string {

      .number {

      }
      .boolean {

      .key {

      .error-highlight {
        background-color: #fed7d7;
        color: #c53030;

        border-radius: 3px;

      }
      .json-error {
        background-color: #fed7d7;
        border: 2px solid #e53e3e;
        color: #c53030;
        padding: 8px;
        border-radius: 6px;
        margin: 5px 0;
        font-weight: 500;
      }
      .json-repaired {
        background-color: #c6f6d5;
        border: 2px solid #38a169;
        color: #2f855a;
        padding: 8px;
        border-radius: 6px;
        margin: 5px 0;
        font-weight: 500;
      }
      .json-preview {
        background-color: #fed7d7;
        border: 2px solid #e53e3e;
        color: #c53030;
        padding: 12px;
        border-radius: 6px;
        margin: 10px 0;
        font-family: "Fira Code", monospace;
        font-size: 14px;
        white-space: pre-wrap;
        max-height: 200px;
        overflow-y: auto;
        position: relative;
      }
      .accept-correction-btn {
        position: absolute;
        top: 8px;
        right: 8px;
        background: #38a169;
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 500;
        transition: background 0.2s;
      }
      .accept-correction-btn:hover {
        background: #2f855a;
      }
      .correction-label {
        font-weight: bold;
        margin-bottom: 8px;
        display: block;
      }
      
      /* Scrollbar personalizada para modo dark */
      ::-webkit-scrollbar {
        width: 8px;

      }
      
      ::-webkit-scrollbar-track {
        background: #2d3748;
        border-radius: 4px;
      }
      
      ::-webkit-scrollbar-thumb {
        background: #4a5568;
        border-radius: 4px;
      }
      
      ::-webkit-scrollbar-thumb:hover {
        background: #718096;
      }
      
      ::-webkit-scrollbar-corner {
        background: #2d3748;
      }
      
      /* Para Firefox */
      * {
        scrollbar-width: thin;
        scrollbar-color: #4a5568 #2d3748;
      }
      .code-line {
        display: flex;
        align-items: flex-start;
        min-height: 21px;
        line-height: 1.5;
      }
      
      .line-number {
        background: #2d3748;
        color: #718096;
        padding: 0 8px 0 12px;
        border-right: 1px solid #4a5568;
        font-family: "Fira Code", monospace;
        font-size: 14px;
        user-select: none;
        text-align: right;
        min-width: 40px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 10px;
      }
      
      .line-content {
        flex: 1;
        padding: 0 12px 0 8px;
        min-width: 0;
        word-wrap: break-word;
        overflow-wrap: break-word;
        white-space: pre-wrap;
      }
      
      .code-collapsible {
        cursor: pointer;
        user-select: none;
        display: inline-flex;
        align-items: center;
        color: #63b3ed;
        font-size: 10px;
        transition: transform 0.2s;
      }
      .code-collapsible::before {
        content: "▼";
        transition: transform 0.2s;
      }
      .code-collapsible.open::before {
        transform: rotate(-90deg);
      }
      .code-content {
        display: none;
      }
      .code-collapsible.open + .code-content {
        display: block;
      }
      
      .collapsed-summary {
        cursor: pointer;
        color: #63b3ed;
        font-style: italic;
        transition: color 0.2s;
      }
      
      .collapsed-summary:hover {
        color: #90cdf4;
      }
      @media (max-width: 1200px) {
        .container {
          gap: 15px;
          padding: 0 15px;
        }
        .editor {
          width: 450px;
          max-width: 450px;
        }
      }
      
      @media (max-width: 1024px) {
        .container {
          gap: 10px;
          padding: 0 10px;
        }
        .editor {
          width: 400px;
          max-width: 400px;
        }
      }
      
      @media (max-width: 768px) {
        .container {
          flex-direction: column;
          gap: 10px;
          padding: 0 10px;
        }
        .editor {
          min-width: 100%;
          width: 100%;
          max-width: 100%;
          min-height: 300px;
        }
        .viewer {
          min-width: 100%;
          width: 100%;
          min-height: 300px;
        }
      }
      
      @media (max-width: 480px) {
        .container {
          padding: 0 5px;
        }
        .editor, .viewer {
          padding: 10px;
        }
        .controls {
          gap: 4px;
        }
        button {
          padding: 5px 8px;
          font-size: 11px;
        }
        select {
          padding: 5px 6px;
          font-size: 11px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Formatador e Validador JSON</h1>
    </header>
    <div class="container">
      <div class="editor">
        <div class="controls">
          <button onclick="formatJSON()">Formatar</button>
          <input
            type="file"
            id="upload"
            style="display: none"
            onchange="uploadFile()"
          />
          <button onclick="document.getElementById('upload').click()">
            Carregar
          </button>
          <button onclick="downloadJSON()">Baixar</button>
          <select id="indent">
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4" selected>4</option>
          </select>
        </div>
        <textarea id="input" placeholder="Cole seu JSON aqui..."></textarea>
        <div id="error"></div>
      </div>
      <div class="viewer">
        <div class="controls">
          <button id="codeBtn" onclick="toggleView('code')">Código</button>
          <button id="treeBtn" onclick="toggleView('tree')">Árvore</button>
          <button onclick="copyJSON()">Copiar</button>
        </div>
        <div id="output" style="display: block"></div>
        <div class="tree-view" id="tree" style="display: none"></div>
      </div>
    </div>

    <script>
      const input = document.getElementById("input");
      const output = document.getElementById("output");
      const tree = document.getElementById("tree");
      const error = document.getElementById("error");
      const indentSelect = document.getElementById("indent");
      let currentView = "code";
      let formattedJSON = ""; // Armazena o JSON formatado

      // Carregar do armazenamento local
      window.onload = () => {
        const saved = localStorage.getItem("jsonData");
        if (saved) {
          input.value = saved;
          formatJSON();
        }
        // Definir botão "Código" como ativo por padrão
        document.getElementById('codeBtn').classList.add('active');
      };

      function formatJSON() {
        let text = input.value.trim();
        error.innerHTML = "";
        
        // Formatação inteligente - remover aspas externas e caracteres desnecessários
        text = smartCleanJSON(text);
        
        try {
          let json = text;
          // Tentar parsear múltiplos níveis de strings JSON
          while (typeof json === "string") {
            json = JSON.parse(json);
          }
          const indent = parseInt(indentSelect.value);
          formattedJSON = JSON.stringify(json, null, indent);
          buildCodeView(json, output, indent * 2);
          buildTree(json, tree);
          localStorage.setItem("jsonData", input.value);
          
          // Mostrar mensagem de sucesso se houve limpeza
          if (text !== input.value.trim()) {
            showMessage("JSON formatado e limpo automaticamente!", "success");
          }
        } catch (e) {
          let errorMessage = e.message;
          // Traduzir mensagens de erro para o português
          if (errorMessage.includes("Unexpected non-whitespace character after JSON")) {
            errorMessage = "Caractere inesperado após o JSON na posição " + (e.message.match(/position \d+/)?.[0]?.replace("position ", "") || "");
          } else if (errorMessage.includes("Unexpected token")) {
            errorMessage = "Token inesperado: " + (e.message.match(/Unexpected token .+ in JSON at position \d+/)?.[0] || "");
          } else if (errorMessage.includes("Unexpected end of JSON input")) {
            errorMessage = "Fim inesperado da entrada JSON";
          } else {
            errorMessage = "Erro ao processar o JSON: " + errorMessage;
          }
          error.innerHTML = `<div class="json-error">Erro: ${errorMessage}</div>`;
          output.innerHTML = "";
          tree.innerHTML = "";
          formattedJSON = "";
        }
      }

      function repairJSON() {
        let text = input.value.trim();
        error.innerHTML = "";
        
        // Formatação inteligente primeiro
        text = smartCleanJSON(text);
        
        try {
          // Tentar parsear primeiro
          let json = text;
          while (typeof json === "string") {
            json = JSON.parse(json);
          }
          // Se chegou aqui, o JSON já está válido
          showMessage("JSON já está válido!", "success");
          formatJSON();
          return;
        } catch (e) {
          // Se falhou, tentar reparar usando a mensagem de erro específica
          const repaired = repairBrokenJSONWithError(text, e.message);
          if (repaired !== text) {
            // Mostrar o JSON reparado em vermelho com botão de aceitar
            showRepairedJSON(repaired, text);
          } else {
            showMessage("Não foi possível reparar o JSON automaticamente. Verifique a sintaxe manualmente.", "error");
          }
        }
      }

      function showRepairedJSON(repairedJSON, originalJSON) {
        // Armazenar o JSON reparado globalmente para uso posterior
        window.currentRepairedJSON = repairedJSON;
        
        // Formatar o JSON reparado para exibição
        let formattedRepaired;
        try {
          const parsed = JSON.parse(repairedJSON);
          const indent = parseInt(indentSelect.value);
          formattedRepaired = JSON.stringify(parsed, null, indent);
        } catch (e) {
          formattedRepaired = repairedJSON;
        }

        // Criar o HTML para mostrar o JSON reparado
        const previewHTML = `
          <div class="json-preview">
            <button class="accept-correction-btn" onclick="acceptCorrection()">
              Aceitar Correção
            </button>
            <span class="correction-label">JSON Reparado (clique em "Aceitar Correção" para aplicar):</span>
            ${escapeHtml(formattedRepaired)}
          </div>
        `;
        
        error.innerHTML = previewHTML;
      }

      function acceptCorrection() {
        // Aplicar a correção no campo de entrada
        if (window.currentRepairedJSON) {
          input.value = window.currentRepairedJSON;
          
          // Limpar a área de erro
          error.innerHTML = "";
          
          // Formatar o JSON automaticamente
          formatJSON();
          
          // Mostrar mensagem de sucesso
          showMessage("Correção aplicada com sucesso!", "success");
          
          // Limpar a variável global
          window.currentRepairedJSON = null;
        }
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      function repairBrokenJSONWithError(text, errorMessage) {
        let repaired = text;
        
        // Análise inteligente da estrutura
        const analysis = analyzeJSONStructure(text);
        
        // Reparar baseado na análise
        if (analysis.multipleObjects && !analysis.hasOpeningBracket && !analysis.hasClosingBracket) {
          // Múltiplos objetos sem colchetes - adicionar colchetes de array
          repaired = '[' + text + ']';
        } else if (analysis.needsOpeningBracket && analysis.hasClosingBracket) {
          // Falta colchete/chave de abertura
          repaired = addMissingOpening(text, analysis);
        } else if (analysis.needsClosingBracket && analysis.hasOpeningBracket) {
          // Falta colchete/chave de fechamento
          repaired = addMissingClosing(text, analysis);
        } else if (analysis.missingCommas > 0) {
          // Falta vírgulas
          repaired = repairMissingCommas(text);
        } else {
          // Tentar reparo geral
          repaired = repairBrokenJSON(text);
        }
        
        // Se ainda não funcionou, tentar abordagem específica baseada no erro
        if (repaired === text) {
          if (errorMessage.includes("Expected ',' or ']'") || errorMessage.includes("Expected ',' or '}'")) {
            repaired = trySpecificRepair(repaired, errorMessage);
          }
        }
        
        return repaired;
      }
      
      function analyzeJSONStructure(text) {
        const trimmed = text.trim();
        const openBraces = (trimmed.match(/\{/g) || []).length;
        const closeBraces = (trimmed.match(/\}/g) || []).length;
        const openBrackets = (trimmed.match(/\[/g) || []).length;
        const closeBrackets = (trimmed.match(/\]/g) || []).length;
        
        const startsWithBrace = trimmed.startsWith('{');
        const startsWithBracket = trimmed.startsWith('[');
        const endsWithBrace = trimmed.endsWith('}');
        const endsWithBracket = trimmed.endsWith(']');
        
        const hasOpeningBracket = startsWithBrace || startsWithBracket;
        const hasClosingBracket = endsWithBrace || endsWithBracket;
        
        // Detectar múltiplos objetos separados por vírgulas
        const multipleObjects = detectMultipleObjects(trimmed);
        
        const needsOpeningBracket = !hasOpeningBracket && (closeBraces > 0 || closeBrackets > 0);
        const needsClosingBracket = !hasClosingBracket && (openBraces > 0 || openBrackets > 0);
        
        // Contar vírgulas faltando (aproximação)
        const missingCommas = Math.max(0, Math.max(openBraces - closeBraces, openBrackets - closeBrackets));
        
        return {
          openBraces,
          closeBraces,
          openBrackets,
          closeBrackets,
          hasOpeningBracket,
          hasClosingBracket,
          needsOpeningBracket,
          needsClosingBracket,
          missingCommas,
          multipleObjects,
          isArray: startsWithBracket || (!startsWithBrace && !startsWithBracket && closeBrackets > 0) || multipleObjects,
          isObject: startsWithBrace || (!startsWithBracket && !startsWithBrace && closeBraces > 0)
        };
      }
      
      function detectMultipleObjects(text) {
        // Contar quantos objetos completos existem
        let braceCount = 0;
        let objectCount = 0;
        let inString = false;
        let escapeNext = false;
        
        for (let i = 0; i < text.length; i++) {
          const char = text[i];
          
          if (escapeNext) {
            escapeNext = false;
            continue;
          }
          
          if (char === '\\') {
            escapeNext = true;
            continue;
          }
          
          if (char === '"' && !escapeNext) {
            inString = !inString;
            continue;
          }
          
          if (!inString) {
            if (char === '{') {
              braceCount++;
            } else if (char === '}') {
              braceCount--;
              if (braceCount === 0) {
                objectCount++;
              }
            }
          }
        }
        
        // Se há mais de 1 objeto completo, provavelmente é um array
        return objectCount > 1;
      }
      
      function addMissingOpening(text, analysis) {
        let repaired = text.trim();
        
        if (analysis.multipleObjects || analysis.isArray) {
          repaired = '[' + repaired;
        } else {
          repaired = '{' + repaired;
        }
        
        return repaired;
      }
      
      function addMissingClosing(text, analysis) {
        let repaired = text.trim();
        
        if (analysis.multipleObjects || analysis.isArray) {
          repaired = repaired + ']';
        } else {
          repaired = repaired + '}';
        }
        
        return repaired;
      }

      function smartCleanJSON(text) {
        // Remover aspas externas se existirem
        if ((text.startsWith('"') && text.endsWith('"')) || 
            (text.startsWith("'") && text.endsWith("'"))) {
          text = text.slice(1, -1);
        }
        
        // Remover escapes desnecessários
        text = text.replace(/\\"/g, '"').replace(/\\'/g, "'");
        
        // Remover quebras de linha desnecessárias no início e fim
        text = text.trim();
        
        return text;
      }

      function repairBrokenJSON(text) {
        let repaired = text;
        let changes = [];
        
        // Primeiro, tentar reparar vírgulas faltando antes de fechar arrays/objetos
        repaired = repairMissingCommas(repaired);
        
        // Contar chaves e colchetes
        const openBraces = (repaired.match(/\{/g) || []).length;
        const closeBraces = (repaired.match(/\}/g) || []).length;
        const openBrackets = (repaired.match(/\[/g) || []).length;
        const closeBrackets = (repaired.match(/\]/g) || []).length;
        
        // Adicionar chaves faltando
        if (openBraces > closeBraces) {
          const missingBraces = openBraces - closeBraces;
          repaired += '}'.repeat(missingBraces);
          changes.push(`${missingBraces} chave(s) de fechamento adicionada(s)`);
        }
        
        // Adicionar colchetes faltando
        if (openBrackets > closeBrackets) {
          const missingBrackets = openBrackets - closeBrackets;
          repaired += ']'.repeat(missingBrackets);
          changes.push(`${missingBrackets} colchete(s) de fechamento adicionado(s)`);
        }
        
        // Verificar se o JSON agora é válido
        try {
          JSON.parse(repaired);
          return repaired;
        } catch (e) {
          // Se ainda não funcionou, tentar uma abordagem mais agressiva
          return tryAdvancedRepair(text);
        }
      }

      function repairMissingCommas(text) {
        let repaired = text;
        
        // Reparar vírgulas faltando antes de fechar arrays/objetos
        // Padrão: elemento seguido de } ou ] sem vírgula
        repaired = repaired.replace(/([^,}\]])\s*([}\]])(?=\s*[}\]]|$)/g, '$1,$2');
        
        // Reparar vírgulas faltando entre elementos de array/objeto
        repaired = repaired.replace(/([}\]])\s*([{\[])/g, '$1,$2');
        
        // Reparar vírgulas faltando entre strings, números, etc.
        repaired = repaired.replace(/([^,}\]])\s*([{\[])/g, '$1,$2');
        
        // Reparar vírgulas faltando após strings não fechadas
        repaired = repaired.replace(/"\s*([}\]])(?=\s*[}\]]|$)/g, '",$1');
        
        // Reparar vírgulas faltando após números
        repaired = repaired.replace(/(\d+)\s*([}\]])(?=\s*[}\]]|$)/g, '$1,$2');
        
        // Reparar vírgulas faltando após booleanos/null
        repaired = repaired.replace(/(true|false|null)\s*([}\]])(?=\s*[}\]]|$)/g, '$1,$2');
        
        return repaired;
      }

      function tryAdvancedRepair(text) {
        let repaired = text.trim();
        
        // Primeiro, tentar reparar vírgulas mais agressivamente
        repaired = repairMissingCommas(repaired);
        
        // Se não começa com { ou [, adicionar
        if (!repaired.startsWith('{') && !repaired.startsWith('[')) {
          // Tentar determinar se deveria ser objeto ou array
          if (repaired.includes(':') || repaired.includes('"')) {
            repaired = '{' + repaired;
          } else {
            repaired = '[' + repaired;
          }
        }
        
        // Se não termina com } ou ], adicionar
        if (!repaired.endsWith('}') && !repaired.endsWith(']')) {
          // Tentar determinar se deveria ser objeto ou array
          if (repaired.includes(':') || repaired.includes('"')) {
            repaired = repaired + '}';
          } else {
            repaired = repaired + ']';
          }
        }
        
        // Tentar uma última vez reparar vírgulas após adicionar chaves/colchetes
        repaired = repairMissingCommas(repaired);
        
        // Verificar se agora é válido
        try {
          JSON.parse(repaired);
          return repaired;
        } catch (e) {
          // Se ainda não funcionou, tentar uma abordagem mais específica baseada no erro
          return trySpecificRepair(text, e.message);
        }
      }

      function trySpecificRepair(text, errorMessage) {
        let repaired = text.trim();
        
        // Se o erro menciona "Expected ',' or ']'", tentar adicionar vírgulas mais especificamente
        if (errorMessage.includes("Expected ',' or ']'")) {
          // Primeiro, tentar adicionar vírgulas em posições específicas
          repaired = repaired.replace(/([^,}\]])\s*([}\]])(?=\s*[}\]]|$)/g, '$1,$2');
          
          // Reparar vírgulas faltando após strings, números, booleanos, null
          repaired = repaired.replace(/"\s*([}\]])(?=\s*[}\]]|$)/g, '",$1');
          repaired = repaired.replace(/(\d+)\s*([}\]])(?=\s*[}\]]|$)/g, '$1,$2');
          repaired = repaired.replace(/(true|false|null)\s*([}\]])(?=\s*[}\]]|$)/g, '$1,$2');
          
          // Se ainda não tem colchete de fechamento, adicionar
          const openBrackets = (repaired.match(/\[/g) || []).length;
          const closeBrackets = (repaired.match(/\]/g) || []).length;
          if (openBrackets > closeBrackets) {
            repaired += ']';
          }
        }
        
        // Se o erro menciona "Expected ',' or '}'", tentar adicionar vírgulas em objetos
        if (errorMessage.includes("Expected ',' or '}'")) {
          repaired = repaired.replace(/([^,}\]])\s*([}\]])(?=\s*[}\]]|$)/g, '$1,$2');
          
          // Reparar vírgulas faltando após strings, números, booleanos, null
          repaired = repaired.replace(/"\s*([}\]])(?=\s*[}\]]|$)/g, '",$1');
          repaired = repaired.replace(/(\d+)\s*([}\]])(?=\s*[}\]]|$)/g, '$1,$2');
          repaired = repaired.replace(/(true|false|null)\s*([}\]])(?=\s*[}\]]|$)/g, '$1,$2');
          
          // Se ainda não tem chave de fechamento, adicionar
          const openBraces = (repaired.match(/\{/g) || []).length;
          const closeBraces = (repaired.match(/\}/g) || []).length;
          if (openBraces > closeBraces) {
            repaired += '}';
          }
        }
        
        return repaired;
      }

      let globalLineNumber = 1;

      function buildCodeView(json, parent, indent = 4, level = 0) {
        parent.innerHTML = "";
        globalLineNumber = 1;
        buildObjectRecursive(json, parent, indent, level);
      }

      function buildObjectRecursive(obj, parent, indent, level, needsComma = false) {
        const isArray = Array.isArray(obj);

        // Abrir chave/colchete
        const openLine = createCodeLine(globalLineNumber++, level * indent, true);
        const openSpan = document.createElement("span");
        openSpan.textContent = isArray ? "[" : "{";
        openLine.querySelector('.line-content').appendChild(openSpan);
        parent.appendChild(openLine);
        
        // Armazenar se precisa de vírgula
        openLine.dataset.needsComma = needsComma;

        // Conteúdo
        const content = document.createElement("div");
        content.className = "code-content";
        content.style.display = "block";

        const entries = isArray
          ? obj.map((v, i) => [i, v])
          : Object.entries(obj);

        entries.forEach(([key, value], index) => {
          if (value !== null && typeof value === "object") {
            // Para objetos/arrays aninhados
            if (!isArray) {
              const keyLine = createCodeLine(globalLineNumber++, (level + 1) * indent);
              const keySpan = document.createElement("span");
              keySpan.className = "key";
              keySpan.textContent = `"${key}": `;
              keyLine.querySelector('.line-content').appendChild(keySpan);
              content.appendChild(keyLine);
            }
            
            // Construir o objeto/array aninhado
            const needsComma = index < entries.length - 1;
            buildObjectRecursive(value, content, indent, level + 1, needsComma);
          } else {
            // Para valores simples
            const line = createCodeLine(globalLineNumber++, (level + 1) * indent);

            if (!isArray) {
              const keySpan = document.createElement("span");
              keySpan.className = "key";
              keySpan.textContent = `"${key}": `;
              line.querySelector('.line-content').appendChild(keySpan);
            }

            const valSpan = document.createElement("span");
            valSpan.className = typeof value;
            valSpan.textContent = JSON.stringify(value);
            if (typeof value === "string" && isImageUrl(value)) {
              const previewDiv = document.createElement("div");
              previewDiv.className = "image-preview";
              previewDiv.appendChild(valSpan);
              const preview = document.createElement("div");
              preview.className = "preview";
              const img = document.createElement("img");
              img.src = value;
              preview.appendChild(img);
              previewDiv.appendChild(preview);
              line.querySelector('.line-content').appendChild(previewDiv);
            } else {
              line.querySelector('.line-content').appendChild(valSpan);
            }
            
            // Adicionar vírgula após o valor se não for o último elemento
            if (index < entries.length - 1) {
              line.querySelector('.line-content').appendChild(document.createTextNode(","));
            }
            
            content.appendChild(line);
          }
        });

        parent.appendChild(content);

        // Fechar chave/colchete
        const closeLine = createCodeLine(globalLineNumber++, level * indent);
        closeLine.querySelector('.line-content').textContent = isArray ? "]" : "}";
        parent.appendChild(closeLine);

        // Toggle
        const collapsible = openLine.querySelector('.code-collapsible');
        
        // Função para expandir/colapsar
        const toggleContent = () => {
          const isOpen = content.style.display !== "none";
          content.style.display = isOpen ? "none" : "block";
          closeLine.style.display = isOpen ? "none" : "block";
          collapsible.classList.toggle("open");
          
          // Atualizar o texto da linha quando colapsar
          if (isOpen) {
            const summary = isArray ? `[...]` : `{...}`;
            const needsComma = openLine.dataset.needsComma === 'true';
            const finalSummary = needsComma ? `${summary},` : summary;
            openLine.querySelector('.line-content').innerHTML = `<span class="collapsed-summary">${finalSummary}</span>`;
          } else {
            // Restaurar o conteúdo original - apenas o span dentro do line-content
            const originalSpan = document.createElement("span");
            originalSpan.textContent = isArray ? "[" : "{";
            openLine.querySelector('.line-content').innerHTML = "";
            openLine.querySelector('.line-content').appendChild(originalSpan);
            
            // Garantir que a linha de fechamento seja exibida corretamente
            closeLine.style.display = "flex";
          }
        };
        
        // Clique na seta
        collapsible.onclick = (e) => {
          e.stopPropagation();
          toggleContent();
        };
        
        // Clique na linha quando colapsada
        openLine.onclick = (e) => {
          // Só expandir se estiver colapsado e não clicou na seta
          if (content.style.display === "none" && !e.target.classList.contains('code-collapsible')) {
            toggleContent();
          }
        };
      }

      function createCodeLine(lineNum, marginLeft, hasCollapsible = false) {
        const line = document.createElement("div");
        line.className = "code-line";
        
        const lineNumber = document.createElement("div");
        lineNumber.className = "line-number";
        
        const numberSpan = document.createElement("span");
        numberSpan.textContent = lineNum;
        lineNumber.appendChild(numberSpan);
        
        if (hasCollapsible) {
          const collapsible = document.createElement("span");
          collapsible.className = "code-collapsible";
          lineNumber.appendChild(collapsible);
        }
        
        const lineContent = document.createElement("div");
        lineContent.className = "line-content";
        lineContent.style.marginLeft = `${marginLeft}px`;
        
        line.appendChild(lineNumber);
        line.appendChild(lineContent);
        
        return line;
      }

        // Inicializar estado colapsado após todos os elementos serem criados
        initializeCollapsedState(parent, lines);
        
        } catch (e) {

          parent.innerHTML = `<div style="color: red;">Erro ao construir visualização em árvore: ${e.message}</div>`;

      function initializeCollapsedState(parent, lines) {
        // Iniciar com tudo expandido - não esconder nada por padrão
        const allLines = parent.querySelectorAll('.tree-line');
        allLines.forEach((lineElement) => {
          const lineText = lineElement.textContent.trim();
          if (lineText.includes('{') || lineText.includes('[')) {
            // Usar a nova função para garantir que tudo esteja visível
            toggleChildLines(lineElement, false); // false = expandir
          }
        });
      }
      
      function getChildLines(parentIndex, lines) {
        const childLines = [];
        const parentLine = lines[parentIndex];
        const indentLevel = getIndentLevel(parentLine);
        
        // Para arrays, pegar apenas as linhas imediatamente filhas (próximo nível de indentação)
        for (let i = parentIndex + 1; i < lines.length; i++) {
          const currentIndent = getIndentLevel(lines[i]);
          
          // Se a indentação é menor ou igual ao pai, paramos
          if (currentIndent <= indentLevel) {
            break;
          }
          
          // Se a indentação é exatamente o próximo nível, é filho direto
          if (currentIndent === indentLevel + 1) {
            childLines.push(i);
          }
        }
        
        return childLines;
      }
      
      function getIndentLevel(line) {
        return (line.match(/^  /g) || []).length;
      }
      
      function toggleChildLines(parentElement, shouldCollapse) {
        const parentText = parentElement.textContent.trim();
        const parentIndent = getIndentLevel(parentText);
        const allLines = parentElement.parentElement.querySelectorAll('.tree-line');
        
        console.log(`Toggle para: "${parentText}" (indent: ${parentIndent}, shouldCollapse: ${shouldCollapse})`);
        
        // Encontrar o índice do elemento pai
        let parentIndex = -1;
        allLines.forEach((line, index) => {
          if (line === parentElement) {
            parentIndex = index;
          }
        });
        
        if (parentIndex === -1) {
          console.log("Elemento pai não encontrado!");
          return;
        }
        
        console.log(`Índice do pai: ${parentIndex}`);
        
        // Encontrar e togglear as linhas filhas
        for (let i = parentIndex + 1; i < allLines.length; i++) {
          const childLine = allLines[i];
          const childText = childLine.textContent.trim();
          const childIndent = getIndentLevel(childText);
          
          console.log(`Verificando linha ${i}: "${childText}" (indent: ${childIndent})`);
          
          // Se a indentação é menor ou igual ao pai, paramos
          if (childIndent <= parentIndent) {
            console.log(`Parando - indentação menor ou igual ao pai`);
            break;
          }
          
          // Se é filho direto (próximo nível), togglear
          if (childIndent === parentIndent + 1) {
            childLine.style.display = shouldCollapse ? "none" : "flex";
            console.log(`Toggle child: "${childText}" -> ${shouldCollapse ? 'hidden' : 'visible'}`);
          }
        }
      }
      
      function buildTreeTextWithNumbers(obj, lines, lineNumbers, level, startLineNumber) {
        const indent = "  ".repeat(level);
        const isArray = Array.isArray(obj);
        let currentLineNumber = startLineNumber;
        
        if (isArray) {
          lines.push(`${indent}[`);
          lineNumbers.push(currentLineNumber++);
          obj.forEach((item, index) => {
            if (typeof item === "object" && item !== null) {
              // Para objetos dentro de arrays, apenas indicar o índice
              lines.push(`${indent}  ${index}:`);
              lineNumbers.push(currentLineNumber++);
              currentLineNumber = buildTreeTextWithNumbers(item, lines, lineNumbers, level + 2, currentLineNumber);
            } else {
              const value = typeof item === "string" ? `"${item}"` : item;
              lines.push(`${indent}  ${index}: ${value}`);
              lineNumbers.push(currentLineNumber++);
            }
          });
          lines.push(`${indent}]`);
          lineNumbers.push(currentLineNumber++);
        } else {
          lines.push(`${indent}{`);
          lineNumbers.push(currentLineNumber++);
          Object.entries(obj).forEach(([key, value]) => {
            if (typeof value === "object" && value !== null) {
              lines.push(`${indent}  "${key}":`);
              lineNumbers.push(currentLineNumber++);
              currentLineNumber = buildTreeTextWithNumbers(value, lines, lineNumbers, level + 2, currentLineNumber);
            } else {
              const val = typeof value === "string" ? `"${value}"` : value;
              lines.push(`${indent}  "${key}": ${val}`);
              lineNumbers.push(currentLineNumber++);
            }
          });
          lines.push(`${indent}}`);
          lineNumbers.push(currentLineNumber++);
        }
        
        return currentLineNumber;
      }
      
      function buildTreeText(obj, lines, level) {
        const indent = "  ".repeat(level);
        const isArray = Array.isArray(obj);
        
        if (isArray) {
          lines.push(`${indent}[`);
          obj.forEach((item, index) => {
            if (typeof item === "object" && item !== null) {
              lines.push(`${indent}  ${index}:`);
              buildTreeText(item, lines, level + 2);
            } else {
              const value = typeof item === "string" ? `"${item}"` : item;
              lines.push(`${indent}  ${index}: ${value}`);
            }
          });
          lines.push(`${indent}]`);
        } else {
          lines.push(`${indent}{`);
          Object.entries(obj).forEach(([key, value]) => {
            if (typeof value === "object" && value !== null) {
              lines.push(`${indent}  "${key}":`);
              buildTreeText(value, lines, level + 2);
            } else {
              const val = typeof value === "string" ? `"${value}"` : value;
              lines.push(`${indent}  "${key}": ${val}`);
            }
          });
          lines.push(`${indent}}`);
        }
      }

          console.log(`Botão ${index}: "${btn.textContent}" - Parent: "${btn.parentElement.textContent.trim()}"`);

      }
      
      window.testTreeMinimize = testTreeMinimize;

      // Função de debug detalhada para a árvore
      function debugTreeDetailed() {
        console.log("=== DEBUG DETALHADO DA ÁRVORE ===");
        const treeElement = document.getElementById('tree');
        const lines = treeElement.querySelectorAll('.tree-line');
        console.log(`Total de linhas: ${lines.length}`);
        
        lines.forEach((line, index) => {
          const content = line.textContent.trim();
          const indent = getIndentLevel(content);
          const hasExpandBtn = line.querySelector('.tree-expand-btn');
          const expandBtnText = hasExpandBtn ? hasExpandBtn.textContent : 'N/A';
          
          console.log(`Linha ${index}: "${content}" (indent: ${indent}, expand: ${!!hasExpandBtn}, btn: "${expandBtnText}")`);
          
          // Mostrar estrutura HTML da linha
          if (hasExpandBtn) {
            console.log(`  - HTML:`, line.innerHTML);
          }
        });
        
        // Testar toggle manualmente
        const firstExpandBtn = treeElement.querySelector('.tree-expand-btn');
        if (firstExpandBtn) {
          console.log("Testando toggle do primeiro botão...");
          firstExpandBtn.click();
          console.log("Toggle executado. Verifique se as linhas filhas foram escondidas/mostradas.");
        } else {
          console.log("Nenhum botão de expandir encontrado!");
        }
      }
      
      window.debugTreeDetailed = debugTreeDetailed;
    </script>
